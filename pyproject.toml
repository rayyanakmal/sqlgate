[project]
name = "sqlgate"
version = "0.1.0"
description = "Natural language to safe, executable SQL through a deterministic gate. LLM proposes meaning, code disposes form."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25.0",
    "httpx>=0.27",
    "typer>=0.12",
    "streamlit>=1.36",
    "pandas>=2.2",
]

[project.scripts]
sqlgate = "sqlgate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
